<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap');

  :root {
    --red: #e60026;
    --red2: #ff1a3c;
    --dark: #0a0a0a;
    --dark2: #111111;
    --dark3: #1a1a1a;
    --dark4: #222222;
    --white: #ffffff;
    --gray: #888888;
    --gray2: #444444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Oswald', 'Hiragino Kaku Gothic ProN', sans-serif; background: var(--dark); color: var(--white); min-height: 100vh; overflow-x: hidden; }

  /* 認証バー */
  #auth-bar {
    background: var(--dark2);
    border-bottom: 2px solid var(--red);
    padding: 8px 16px;
    display: flex; align-items: center; justify-content: flex-end; gap: 12px;
    min-height: 44px;
  }
  #auth-bar .user-name { font-size: 0.8em; color: var(--gray); letter-spacing: 1px; }
  .sync-badge { font-size: 0.75em; color: var(--red2); letter-spacing: 1px; }
  .auth-btn { padding: 6px 16px; border: none; cursor: pointer; font-family: 'Oswald', sans-serif; font-size: 0.85em; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
  .auth-btn.login { background: var(--red); color: var(--white); }
  .auth-btn.login:active { background: var(--red2); }
  .auth-btn.logout { background: var(--dark4); color: var(--gray); border: 1px solid var(--gray2); }

  /* ヘッダー */
  #header {
    background: var(--dark2);
    padding: 0;
    position: relative;
    overflow: hidden;
  }
  #header::before {
    content: '';
    position: absolute;
    top: 0; left: -10px; right: 0; bottom: 0;
    background: var(--red);
    clip-path: polygon(0 0, 200px 0, 160px 100%, 0 100%);
    z-index: 0;
  }
  #header h1 {
    position: relative; z-index: 1;
    padding: 18px 24px 18px 40px;
    font-size: 1.8em;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--white);
    text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
  }
  #header h1 span { color: var(--red); }

  .container { max-width: 600px; margin: 0 auto; padding: 16px; }

  /* 機種セレクト */
  .machine-select {
    width: 100%; padding: 12px 16px;
    font-size: 1em; font-family: 'Oswald', sans-serif; letter-spacing: 1px;
    background: var(--dark3); color: var(--white);
    border: 2px solid var(--red); border-radius: 0;
    margin-bottom: 16px;
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
    cursor: pointer;
  }

  /* セクションヘッダー */
  .section-label {
    font-size: 0.72em; font-weight: 600; letter-spacing: 3px;
    text-transform: uppercase; color: var(--red);
    margin-bottom: 4px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-label::before { content: '▶'; font-size: 0.8em; }

  /* カウンター */
  .counter-group {
    margin-bottom: 10px;
    background: var(--dark3);
    border-left: 3px solid var(--red);
    padding: 10px 12px;
  }
  .counter-label { font-size: 0.78em; letter-spacing: 2px; text-transform: uppercase; color: var(--gray); margin-bottom: 8px; }
  .counter-note { font-size: 0.68em; color: var(--gray2); margin-top: 4px; letter-spacing: 1px; }
  .hi { max-width:160px; margin-top:5px; display:block; border:1px solid #333; border-radius:2px; }
  .help-btn { display: inline-flex; align-items: center; justify-content: center; width: 17px; height: 17px; background: var(--gray2); color: var(--white); border: none; border-radius: 50%; font-size: 0.65em; font-weight: 700; cursor: pointer; margin-left: 6px; vertical-align: middle; padding: 0; font-family: 'Oswald', sans-serif; flex-shrink: 0; }
  .help-btn:active { background: var(--red); }
  .help-text { font-size: 0.73em; color: #aaa; background: #0d0d0d; border-left: 2px solid var(--gray2); padding: 7px 10px; margin-top: 4px; line-height: 1.6; }
  .counter-row { display: flex; align-items: center; gap: 8px; }
  .counter-btn {
    width: 48px; height: 48px;
    font-size: 1.5em; font-weight: 700;
    border: none; cursor: pointer;
    flex-shrink: 0; user-select: none; -webkit-user-select: none;
    font-family: 'Oswald', sans-serif;
    clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
    transition: filter 0.1s;
  }
  .counter-btn.games { width: 68px; font-size: 1em; letter-spacing: 1px; }
  .counter-btn.minus { background: var(--dark4); color: var(--gray); }
  .counter-btn.minus:active { filter: brightness(1.5); }
  .counter-btn.plus  { background: var(--red); color: var(--white); }
  .counter-btn.plus:active  { filter: brightness(1.3); }
  .counter-val {
    flex: 1; text-align: center;
    font-size: 1.8em; font-weight: 700;
    color: var(--white); background: var(--dark);
    padding: 6px 0; min-width: 60px;
    border-bottom: 2px solid var(--red);
  }
  .games-input {
    flex: 1; text-align: center;
    font-size: 1.8em; font-weight: 700;
    color: var(--white); background: var(--dark);
    border: none; border-bottom: 2px solid var(--red);
    padding: 6px 0; width: 100%;
    font-family: 'Oswald', sans-serif;
  }
  .games-input:focus { outline: none; border-bottom-color: var(--red2); }

  /* 確定演出 */
  .events-section { margin-bottom: 14px; background: var(--dark3); border-left: 3px solid var(--gray2); padding: 10px 12px; }
  .events-section label.main { font-size: 0.72em; letter-spacing: 2px; text-transform: uppercase; color: var(--gray); margin-bottom: 8px; display: block; }
  .event-item { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #1e1e1e; }
  .event-item:last-child { border-bottom: none; }
  .event-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--red); flex-shrink: 0; }
  .event-item span { font-size: 0.85em; letter-spacing: 1px; }

  /* ボタン群 */
  .btn-row { display: flex; gap: 8px; margin-top: 14px; }
  button#calc-btn {
    flex: 1; padding: 16px;
    background: var(--red); color: var(--white);
    font-size: 1.1em; font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
    border: none; cursor: pointer;
    font-family: 'Oswald', sans-serif;
    clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
    transition: filter 0.1s;
  }
  button#calc-btn:active { filter: brightness(1.2); }
  button#reset-count-btn {
    padding: 16px 18px;
    background: var(--dark4); color: var(--gray);
    border: 1px solid var(--gray2);
    cursor: pointer; font-size: 0.85em; letter-spacing: 2px; text-transform: uppercase;
    font-family: 'Oswald', sans-serif;
    white-space: nowrap;
  }
  button#reset-count-btn:active { background: var(--dark3); }

  /* サブボタン */
  .sub-btn-row { display: flex; gap: 8px; margin-top: 8px; }
  .sub-btn {
    flex: 1; padding: 10px;
    background: var(--dark3); color: var(--gray);
    border: 1px solid var(--gray2);
    cursor: pointer; font-size: 0.78em; letter-spacing: 2px; text-transform: uppercase;
    font-family: 'Oswald', sans-serif;
    transition: border-color 0.2s, color 0.2s;
  }
  .sub-btn:active { border-color: var(--red); color: var(--white); }
  .sub-btn.red { border-color: var(--red); color: var(--red); }

  .save-badge { font-size: 0.7em; color: var(--red); text-align: right; margin-top: 6px; min-height: 1em; letter-spacing: 2px; }

  /* 結果 */
  #result { margin-top: 20px; background: var(--dark2); border-top: 3px solid var(--red); padding: 20px 16px; display: none; }
  .result-header { margin-bottom: 16px; }
  .result-label { font-size: 0.7em; letter-spacing: 3px; text-transform: uppercase; color: var(--red); margin-bottom: 4px; }
  .high-prob { font-size: 2.2em; font-weight: 700; color: var(--white); line-height: 1; }
  .high-prob span { color: var(--red); }
  .confidence { font-size: 0.75em; color: var(--gray); letter-spacing: 2px; margin-top: 6px; }

  .setting-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .setting-label { width: 52px; font-size: 0.85em; font-weight: 600; flex-shrink: 0; letter-spacing: 1px; color: var(--gray); }
  .setting-label.top { color: var(--red); }
  .bar-wrap { flex: 1; background: var(--dark4); height: 20px; position: relative; }
  .bar { height: 100%; transition: width 0.6s cubic-bezier(0.4,0,0.2,1); background: var(--gray2); }
  .bar.high { background: linear-gradient(90deg, var(--red), var(--red2)); }
  .bar.mid { background: #4a4a4a; }
  .pct { width: 48px; text-align: right; font-size: 0.9em; flex-shrink: 0; font-weight: 600; }

  .reasons { margin-top: 16px; border-top: 1px solid var(--dark4); padding-top: 12px; }
  .reasons h3 { font-size: 0.7em; letter-spacing: 3px; text-transform: uppercase; color: var(--red); margin-bottom: 8px; }
  .reason-item { font-size: 0.8em; color: #ccc; margin-bottom: 5px; padding-left: 10px; border-left: 2px solid var(--red); letter-spacing: 0.5px; }
  .suggestions { margin-top: 12px; }
  .suggestions h3 { font-size: 0.7em; letter-spacing: 3px; text-transform: uppercase; color: #4a9eff; margin-bottom: 6px; }
  .sug-item { font-size: 0.78em; color: #7ab4ff; margin-bottom: 4px; letter-spacing: 0.5px; }

  /* セッション記録 */
  .session-save { margin-top: 16px; border-top: 1px solid var(--dark4); padding-top: 14px; }
  .session-save h3 { font-size: 0.7em; letter-spacing: 3px; text-transform: uppercase; color: var(--red); margin-bottom: 10px; }
  .session-input {
    width: 100%; padding: 10px 12px;
    background: var(--dark); color: var(--white);
    border: none; border-bottom: 1px solid var(--gray2);
    font-size: 0.95em; margin-bottom: 10px;
    font-family: 'Oswald', sans-serif; letter-spacing: 1px;
  }
  .session-input:focus { outline: none; border-bottom-color: var(--red); }
  .save-session-btn {
    width: 100%; padding: 12px;
    background: transparent; color: var(--red);
    border: 2px solid var(--red);
    cursor: pointer; font-size: 0.85em; font-weight: 600; letter-spacing: 3px; text-transform: uppercase;
    font-family: 'Oswald', sans-serif;
    transition: background 0.2s, color 0.2s;
  }
  .save-session-btn:active { background: var(--red); color: var(--white); }
  .saved-msg { text-align: center; font-size: 0.78em; color: #5dff6a; margin-top: 8px; min-height: 1.2em; letter-spacing: 2px; text-transform: uppercase; }

  .close-result-btn {
    width: 100%; padding: 10px; margin-top: 14px;
    background: transparent; color: var(--gray2);
    border: 1px solid var(--dark4);
    cursor: pointer; font-size: 0.78em; letter-spacing: 2px; text-transform: uppercase;
    font-family: 'Oswald', sans-serif;
  }

  /* モーダル共通 */
  .modal {
    display: none; position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.9); z-index: 100;
    overflow-y: auto; padding: 16px;
  }
  .modal-inner {
    max-width: 600px; margin: 0 auto;
    background: var(--dark2);
    border-top: 3px solid var(--red);
    padding: 20px 16px;
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--dark4);
  }
  .modal-header h2 { font-size: 1em; letter-spacing: 3px; text-transform: uppercase; color: var(--red); }
  .modal-close {
    background: var(--dark4); color: var(--gray);
    border: 1px solid var(--gray2); padding: 5px 12px;
    cursor: pointer; font-family: 'Oswald', sans-serif; font-size: 0.78em; letter-spacing: 1px;
  }

  /* 履歴 */
  .filter-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter-btn {
    padding: 6px 14px; border: 1px solid var(--gray2);
    background: var(--dark3); color: var(--gray);
    cursor: pointer; font-family: 'Oswald', sans-serif; font-size: 0.75em; letter-spacing: 1px;
    transition: all 0.2s;
  }
  .filter-btn.active { border-color: var(--red); color: var(--white); background: var(--dark4); }

  .session-card {
    background: var(--dark3); padding: 14px;
    margin-bottom: 10px; border-left: 3px solid var(--red);
    position: relative;
  }
  .session-card .sc-top { display: flex; justify-content: space-between; font-size: 0.72em; color: var(--gray); letter-spacing: 1px; margin-bottom: 6px; }
  .session-card .sc-machine { font-size: 1em; font-weight: 600; letter-spacing: 2px; }
  .session-card .sc-store { font-size: 0.75em; color: var(--red); letter-spacing: 1px; margin-top: 2px; }
  .session-card .sc-prob { font-size: 1.3em; font-weight: 700; color: var(--white); margin-top: 6px; }
  .session-card .sc-prob span { color: var(--red); }
  .session-card .sc-memo { font-size: 0.78em; color: var(--gray); margin-top: 6px; letter-spacing: 1px; }
  .no-history { text-align: center; color: var(--gray2); padding: 40px; font-size: 0.85em; letter-spacing: 2px; text-transform: uppercase; }

  /* 統計 */
  .stat-section { margin-bottom: 20px; }
  .stat-section h3 { font-size: 0.7em; letter-spacing: 3px; text-transform: uppercase; color: var(--red); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .stat-section h3::before { content: '▶'; }
  .stat-card { background: var(--dark3); padding: 12px 14px; margin-bottom: 8px; border-left: 3px solid var(--gray2); display: flex; justify-content: space-between; align-items: center; }
  .stat-card .sc-name { font-size: 0.88em; letter-spacing: 1px; }
  .stat-card .sc-nums { text-align: right; }
  .stat-card .sc-avg { font-size: 1.1em; font-weight: 700; color: var(--red); }
  .stat-card .sc-count { font-size: 0.72em; color: var(--gray); letter-spacing: 1px; }
  .stat-overview { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .stat-big {
    background: var(--dark3); padding: 16px;
    border-top: 2px solid var(--red);
    text-align: center;
  }
  .stat-big .sb-val { font-size: 2em; font-weight: 700; color: var(--red); }
  .stat-big .sb-label { font-size: 0.65em; letter-spacing: 2px; text-transform: uppercase; color: var(--gray); margin-top: 4px; }
</style>
</head>

<script>

let currentUser = null;

auth.onAuthStateChanged(user => {
  currentUser = user;
  updateAuthUI();

});

function updateAuthUI() {
  const loginBtn = document.getElementById('login-btn');
  const logoutBtn = document.getElementById('logout-btn');
  const userName = document.getElementById('user-name');
  if (currentUser) {
    loginBtn.style.display = 'none';
    logoutBtn.style.display = 'inline-block';
    userName.textContent = currentUser.displayName || currentUser.email;
  } else {
    loginBtn.style.display = 'inline-block';
    logoutBtn.style.display = 'none';
    userName.textContent = '';
  }
}
function signIn() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => alert('ログイン失敗: ' + e.message)); }

// ========== localStorage ==========
function storageKey(machine) { return `slot_judge_${machine}`; }
function loadCountsLocal(machine) { try { return JSON.parse(localStorage.getItem(storageKey(machine)) || "{}"); } catch(e) { return {}; } }
function saveCountsLocal(machine, counts) { localStorage.setItem(storageKey(machine), JSON.stringify(counts)); }
function loadCounts(machine) { return loadCountsLocal(machine); }
function saveCounts(machine, counts) {
  saveCountsLocal(machine, counts);
  if (currentUser) {
    db.collection('users').doc(currentUser.uid).collection('machine_counts').doc(machine)
      .set(counts).then(() => showSyncBadge('SYNCED')).catch(() => showSyncBadge('OFFLINE'));
  }
}
async function syncFromFirestore(machine) {
  if (!currentUser) return;
  showSyncBadge('SYNCING...');
  try {
    const snap = await db.collection('users').doc(currentUser.uid).collection('machine_counts').doc(machine).get();
    if (snap.exists) { saveCountsLocal(machine, snap.data()); renderForm(machine); }
    showSyncBadge('SYNCED');
  } catch(e) { showSyncBadge('OFFLINE'); }
}
function showSyncBadge(msg) {
  const el = document.getElementById('sync-badge');
  if (el) { el.textContent = msg; clearTimeout(el._t); el._t = setTimeout(() => el.textContent = '', 2000); }
}

// ========== 数学ヘルパー ==========
function lgamma(x) {
  if (x<=0) return 0;
  const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];
  let y=x, tmp=x+5.5; tmp-=(x+0.5)*Math.log(tmp); let ser=1.000000000190015;
  for(let j=0;j<6;j++) ser+=c[j]/++y;
  return -tmp+Math.log(2.5066282746310005*ser/x);
}
function poissonLL(k,lam) { if(lam<=0) return 0; return k*Math.log(lam)-lam-lgamma(k+1); }
function binomialLL(k,n,p) { if(n<=0||p<=0||p>=1) return 0; if(k>n) return -Infinity; return k*Math.log(p)+(n-k)*Math.log(1-p); }
function normalizeLLs(settings, llMap) {
  const maxLL=Math.max(...settings.map(s=>llMap[s]||0));
  const raw={}; settings.forEach(s=>raw[s]=Math.exp((llMap[s]||0)-maxLL));
  const total=settings.reduce((a,s)=>a+raw[s],0);
  const probs={}; settings.forEach(s=>probs[s]=raw[s]/total);
  return probs;
}

// ========== 判別ロジック ==========
function calcBayesian(machine, data) {
  const m=MACHINES[machine], S=m.settings;
  const logL={}; S.forEach(s=>logL[s]=0);
  const reasons=[], suggestions=[];

  if(machine==="tokyoghoul"){
    const{games=0,at,cz,upper_cz,cz_100g,cz_100g_total,eb,rebattle,rebattle_total,seishin33}=data;
    if(games>0&&at!=null){S.forEach(s=>logL[s]+=poissonLL(at,games*m.AT_PROB[s]));reasons.push(`AT ${at}回 / ${games}G`);}
    if(games>0&&cz!=null){S.forEach(s=>logL[s]+=poissonLL(cz,games*m.CZ_PROB[s]));reasons.push(`CZ ${cz}回`);}
    if(games>0&&upper_cz!=null){S.forEach(s=>logL[s]+=poissonLL(upper_cz,games*m.UPPER_CZ[s]));if(upper_cz>0)reasons.push(`上位CZ ${upper_cz}回`);}
    if(cz_100g!=null&&cz_100g_total>0){S.forEach(s=>logL[s]+=binomialLL(cz_100g,cz_100g_total,m.CZ_100G[s]));reasons.push(`100G以内CZ ${cz_100g}/${cz_100g_total}回`);}
    if(games>0&&eb!=null){S.forEach(s=>logL[s]+=poissonLL(eb,games*m.EB_PROB[s]));reasons.push(`EB ${eb}回`);}
    if(rebattle!=null&&rebattle_total>0){S.forEach(s=>logL[s]+=binomialLL(rebattle,rebattle_total,m.REBATTLE[s]));reasons.push(`引き戻し ${rebattle}/${rebattle_total}回`);}
    const seishin_total = data.seishin_total;
    if(seishin33!=null&&seishin_total>0){S.forEach(s=>logL[s]+=binomialLL(seishin33,seishin_total,m.SEISHIN33[s]));reasons.push(`精神世界30G ${seishin33}/${seishin_total}回`);}
    if(!upper_cz) suggestions.push("上位CZ（大喰いのリゼ）をカウント");
    if(!cz_100g_total) suggestions.push("100G以内CZ当選/総CZ回数をカウント");
    if(!rebattle) suggestions.push("AT引き戻し 成功/挑戦をカウント");
  }
  else if(machine==="kabaneri"){
    const{games=0,bonus_total,st,bell,female,male,mima=0}=data;
    if(games>0&&bonus_total!=null){S.forEach(s=>logL[s]+=poissonLL(bonus_total,games*m.BONUS_PROB[s]));reasons.push(`ボーナス総当選 ${bonus_total}回`);}
    if(games>0&&st!=null){S.forEach(s=>logL[s]+=poissonLL(st,games*m.ST_PROB[s]));reasons.push(`ST ${st}回 / ${games}G`);}
    if(games>0&&bell!=null){S.forEach(s=>logL[s]+=poissonLL(bell,games*m.BELL_PROB[s]));reasons.push(`下段ベル 1/${bell>0?(games/bell).toFixed(0):"―"}`);}
    if(female!=null&&male!=null){const tot=female+male+(mima||0);if(tot>0){S.forEach(s=>logL[s]+=binomialLL(female,tot,m.FEMALE[s]));reasons.push(`キャラ紹介 女${female}/男${male}`);}}
    if(mima>0) reasons.push(`美馬 ${mima}回 → 設定4以上確定`);
    if(!bell) suggestions.push("下段ベルをカウント（最重要）");
    if(!bonus_total) suggestions.push("ボーナス総当選回数をカウント（初回から）");
  }
  else if(machine==="valvrave"){
    const{games=0,at,haraikiri,human,robot,bar_direct,bar_total}=data;
    if(games>0&&at!=null){S.forEach(s=>logL[s]+=poissonLL(at,games*m.AT_PROB[s]));reasons.push(`AT ${at}回`);}
    if(at>0&&haraikiri!=null){S.forEach(s=>logL[s]+=binomialLL(haraikiri,at*10,m.HARAIKIRI[s]));reasons.push(`ハラキリ ${haraikiri}回`);}
    if(human!=null&&robot!=null){const tot=human+robot;if(tot>0){S.forEach(s=>logL[s]+=binomialLL(human,tot,m.BUFFET_HUMAN[s]));reasons.push(`バッフェ 有人${human}/無人${robot}`);}}
    if(bar_direct!=null&&bar_total>0){S.forEach(s=>logL[s]+=binomialLL(bar_direct,bar_total,m.BAR_DIRECT[s]));reasons.push(`BAR直撃 ${bar_direct}/${bar_total}`);}
    const{special_table,at_2nd}=data;
    if(special_table!=null&&at_2nd>0){S.forEach(s=>logL[s]+=binomialLL(special_table,at_2nd,m.SPECIAL_TABLE[s]));reasons.push(`特殊テーブル ${special_table}/${at_2nd}`);}
    if(!haraikiri) suggestions.push("ハラキリドライブをカウント（最重要）");
    if(!at_2nd) suggestions.push("特殊テーブル当選率をカウント（設定差12倍！）");
  }
  else if(machine==="unicorn"){
    const{games=0,cz,at,female,male}=data;
    if(games>0&&cz!=null){S.forEach(s=>logL[s]+=poissonLL(cz,games*m.CZ_PROB[s]));reasons.push(`CZ ${cz}回`);}
    if(games>0&&at!=null){S.forEach(s=>logL[s]+=poissonLL(at,games*m.AT_PROB[s]));reasons.push(`AT ${at}回`);}
    if(female!=null&&male!=null){const tot=female+male;if(tot>0){S.forEach(s=>logL[s]+=binomialLL(female,tot,m.FEMALE[s]));reasons.push(`STAND BY 女${female}/男${male}`);}}
    if(female==null||male==null) suggestions.push("STAND BYキャラ性別をカウント");
  }
  else if(machine==="monkey"){
    const{games=0,at,fiveroll,weak_total,weak_direct,ex_weak,strong_chance,strong_chance_total,gamo,rival_total,black_medal}=data;
    if(games>0&&at!=null){S.forEach(s=>logL[s]+=poissonLL(at,games*m.AT_PROB[s]));reasons.push(`AT ${at}回`);}
    if(games>0&&fiveroll!=null){S.forEach(s=>logL[s]+=poissonLL(fiveroll,games*m.FIVEROLL[s]));reasons.push(`5枚役 1/${fiveroll>0?(games/fiveroll).toFixed(0):"―"}`);}
    if(weak_total>0){if(weak_direct!=null){S.forEach(s=>{const p=m.WEAK_DIRECT[s];if(p>0)logL[s]+=binomialLL(weak_direct,weak_total,p);else logL[s]+=weak_direct>0?-10:0;});reasons.push(`弱チェリー直撃 ${weak_direct}/${weak_total}`);}if(ex_weak!=null){S.forEach(s=>logL[s]+=binomialLL(ex_weak,weak_total,m.EX_ITEM_WEAK[s]));reasons.push(`EXアイテム ${ex_weak}/${weak_total}`);}}
    if(strong_chance!=null&&strong_chance_total>0){S.forEach(s=>logL[s]+=binomialLL(strong_chance,strong_chance_total,m.STRONG_CHANCE[s]));reasons.push(`強チャンス目直撃 ${strong_chance}/${strong_chance_total}`);}
    if(gamo!=null&&rival_total>0){S.forEach(s=>logL[s]+=binomialLL(gamo,rival_total,m.GAMO[s]));reasons.push(`蒲生モード ${gamo}/${rival_total}`);}
    if(black_medal!=null&&at>0){S.forEach(s=>logL[s]+=binomialLL(black_medal,at,m.BLACK_MEDAL[s]));reasons.push(`黒メダル ${black_medal}/${at}`);}
    if(!fiveroll) suggestions.push("5枚役カウントが最重要");
  }
  else if(machine==="hokuto"){
    const{games=0,at,strong_cherry,weak_cherry,suika_direct,raoh,raoh_total}=data;
    if(games>0&&at!=null){S.forEach(s=>logL[s]+=poissonLL(at,games*m.AT_PROB[s]));reasons.push(`AT ${at}回`);}
    if(games>0&&strong_cherry!=null){S.forEach(s=>logL[s]+=poissonLL(strong_cherry,games*m.STRONG_CH[s]));reasons.push(`強チェリー ${strong_cherry}回`);}
    if(games>0&&weak_cherry!=null){S.forEach(s=>logL[s]+=poissonLL(weak_cherry,games*m.WEAK_CH[s]));reasons.push(`弱チェリー ${weak_cherry}回（逆相関）`);}
    if(suika_direct>0&&games>0){S.forEach(s=>logL[s]+=poissonLL(suika_direct,games*m.SUIKA_DIRECT[s]));reasons.push(`スイカAT直撃 ${suika_direct}回`);}
    if(raoh!=null&&raoh_total>0){S.forEach(s=>logL[s]+=binomialLL(raoh,raoh_total,m.RAOH[s]));reasons.push(`ラオウ ${raoh}/${raoh_total}`);}
    if(!raoh||!raoh_total) suggestions.push("SPバトルのラオウ選択率をカウント（最重要）");
  }
  else if(machine==="kaguya"){
    const{games=0,at,shirogane,reg_total}=data;
    if(games>0&&at!=null){S.forEach(s=>logL[s]+=poissonLL(at,games*m.AT_PROB[s]));reasons.push(`初当たり ${at}回`);}
    if(shirogane!=null&&reg_total>0){S.forEach(s=>logL[s]+=binomialLL(shirogane,reg_total,m.SHIROGANE[s]));reasons.push(`白銀圭シナリオ ${shirogane}/${reg_total}`);}
    if(!shirogane||!reg_total) suggestions.push("REG中の白銀圭シナリオをカウント");
  }
  else if(machine==="milliongod"){
    const{games=0,at,blue7_3hit,blue7_3total}=data;
    if(games>0&&at!=null){S.forEach(s=>logL[s]+=poissonLL(at,games*m.AT_PROB[s]));reasons.push(`GG ${at}回`);}
    if(blue7_3hit!=null&&blue7_3total>0){S.forEach(s=>logL[s]+=binomialLL(blue7_3hit,blue7_3total,m.BLUE7_3[s]));reasons.push(`青7×3連GG ${blue7_3hit}/${blue7_3total}`);}
    if(!blue7_3total) suggestions.push("青7×3連のGG当選をカウント（最重要）");
  }
  else if(machine==="karakuri"){
    const{games=0,cz,at,weak_green,weak_total,strong_green,strong_total,makuai}=data;
    if(games>0&&makuai!=null){S.forEach(s=>logL[s]+=poissonLL(makuai,games*m.MAKUAI[s]));reasons.push(`幕間チャンス ${makuai}回`);}
    if(games>0&&cz!=null){S.forEach(s=>logL[s]+=poissonLL(cz,games*m.CZ_PROB[s]));reasons.push(`CZ ${cz}回`);}
    if(games>0&&at!=null){S.forEach(s=>logL[s]+=poissonLL(at,games*m.AT_PROB[s]));reasons.push(`AT ${at}回`);}
    if(weak_green!=null&&weak_total>0){S.forEach(s=>logL[s]+=binomialLL(weak_green,weak_total,m.WEAK_GREEN[s]));reasons.push(`弱レアランプ緑 ${weak_green}/${weak_total}`);}
    if(strong_green!=null&&strong_total>0){S.forEach(s=>logL[s]+=binomialLL(strong_green,strong_total,m.STRONG_GREEN[s]));reasons.push(`強レアランプ緑 ${strong_green}/${strong_total}`);}
    if(!weak_total) suggestions.push("弱レア小役のランプ色をカウント");
  }
  else if(machine==="tatenoyusha"){
    const{games=0,at,bell,exp=0}=data;
    const scores={}; S.forEach(s=>scores[s]=0);
    if(at>0&&games>0){const actual=games/at;S.forEach(s=>{const diff=Math.abs(actual-1/m.AT_PROB[s])/(1/m.AT_PROB[s]);scores[s]+=Math.max(0,1-diff*2);});reasons.push(`AT 1/${actual.toFixed(0)}`);}
    if(bell>0&&games>0){const actual=games/bell;S.forEach(s=>{const diff=Math.abs(actual-1/m.BELL_PROB[s])/(1/m.BELL_PROB[s]);scores[s]+=Math.max(0,1-diff*3)*0.5;});reasons.push(`共通ベル 1/${actual.toFixed(1)}`);}
    if(exp>=6600){S.filter(s=>s<6).forEach(s=>scores[s]=0);scores[6]=99;reasons.push("EXP 6600 → 設定6確定！");}
    else if(exp>=4400){S.filter(s=>s<4).forEach(s=>scores[s]*=0.1);reasons.push(`EXP ${exp} → 設定4以上確定`);}
    else if(exp>=2200){scores[1]*=0.1;reasons.push(`EXP ${exp} → 設定2以上確定`);}
    const total=S.reduce((a,s)=>a+scores[s],0)||1;
    const probs={}; S.forEach(s=>probs[s]=scores[s]/total);
    if(!bell) suggestions.push("共通ベルをカウント");
    return{probs,reasons,suggestions};
  }
  else if(machine==="codegeass3"){
    const{games=0,at,reg_count,cz_from_reg,suika}=data;
    const scores={}; S.forEach(s=>scores[s]=1.0);
    if(at>0&&games>0){const actual=games/at;S.forEach(s=>{const diff=Math.abs(actual-1/m.AT_PROB[s])/(1/m.AT_PROB[s]);scores[s]*=Math.max(0.1,1-diff*1.5);});reasons.push(`AT 1/${actual.toFixed(0)}`);}
    if(reg_count>=3&&cz_from_reg!=null){const r=cz_from_reg/reg_count;S.forEach(s=>{const diff=Math.abs(r-m.REG_CZ[s])/m.REG_CZ[s];scores[s]*=Math.max(0.1,1-diff*2);});reasons.push(`REG後CZ ${cz_from_reg}/${reg_count}（${(r*100).toFixed(0)}%）`);}
    if(suika>0&&games>0){const actual=games/suika;S.forEach(s=>{const diff=Math.abs(actual-1/m.SUIKA_PROB[s])/(1/m.SUIKA_PROB[s]);scores[s]*=Math.max(0.1,1-diff*2);});reasons.push(`スイカ 1/${actual.toFixed(0)}`);}
    const total=S.reduce((a,s)=>a+scores[s],0)||1;
    const probs={}; S.forEach(s=>probs[s]=scores[s]/total);
    if(!reg_count||!cz_from_reg) suggestions.push("REG後CZ当選率をカウント（最重要）");
    return{probs,reasons,suggestions};
  }
  else if(machine==="madoka3"){
    const{games=0,bonus,cherry,petit_total,petit_big,ceiling_500,ceiling_total}=data;
    const scores={}; S.forEach(s=>scores[s]=1.0);
    if(bonus>0&&games>0){const actual=games/bonus;S.forEach(s=>{const diff=Math.abs(actual-1/m.BONUS_PROB[s])/(1/m.BONUS_PROB[s]);scores[s]*=Math.max(0.1,1-diff*2);});reasons.push(`ボーナス 1/${actual.toFixed(0)}`);}
    if(cherry>=200&&games>0){const actual=games/cherry;S.forEach(s=>{const diff=Math.abs(actual-1/m.CHERRY_PROB[s])/(1/m.CHERRY_PROB[s]);scores[s]*=Math.max(0.1,1-diff*3);});reasons.push(`弱チェリー 1/${actual.toFixed(1)}`);}
    if(petit_total>=5&&petit_big!=null){const r=petit_big/petit_total;S.forEach(s=>{const exp=0.1+(s-1)*0.06;const diff=Math.abs(r-exp)/(exp+0.01);scores[s]*=Math.max(0.1,1-diff*1.5);});reasons.push(`プチ→ビッグ ${petit_big}/${petit_total}`);}
    if(ceiling_total>=3&&ceiling_500!=null){const r=ceiling_500/ceiling_total;S.forEach(s=>{const diff=Math.abs(r-m.CEILING_500[s])/m.CEILING_500[s];scores[s]*=Math.max(0.1,1-diff*2);});reasons.push(`AT後500G天井 ${ceiling_500}/${ceiling_total}（設定差4倍！）`);}
    const total=S.reduce((a,s)=>a+scores[s],0)||1;
    const probs={}; S.forEach(s=>probs[s]=scores[s]/total);
    if(cherry<200) suggestions.push("弱チェリーは200回以上でサンプル有効");
    if(!petit_total||petit_total<5) suggestions.push("プチ→ビッグ昇格率をカウント（設定差3倍！）");
    if(!ceiling_total||ceiling_total<3) suggestions.push("AT後500G天井選択率をカウント（設定差4倍！最重要）");
    return{probs,reasons,suggestions};
  }
  else if(machine==="tokyorevengers"){
    const{games=0,at,bell,midnight,midnight_total}=data;
    if(games>0&&at!=null){S.forEach(s=>logL[s]+=poissonLL(at,games*m.AT_PROB[s]));reasons.push(`AT ${at}回 / ${games}G`);}
    if(games>0&&bell!=null){S.forEach(s=>logL[s]+=poissonLL(bell,games*m.BELL_PROB[s]));reasons.push(`共通ベル 1/${bell>0?(games/bell).toFixed(0):"―"}`);}
    if(midnight!=null&&midnight_total>0){S.forEach(s=>logL[s]+=binomialLL(midnight,midnight_total,m.MIDNIGHT[s]));reasons.push(`ミッドナイトモード ${midnight}/${midnight_total}`);}
    if(!bell) suggestions.push("共通ベルをカウント（最重要）");
    if(!midnight_total) suggestions.push("ミッドナイトモード移行率をカウント");
  }
  else if(machine==="rezero2"){
    const{games=0,at,hikimodosi,hikimodosi_total}=data;
    if(games>0&&at!=null){S.forEach(s=>logL[s]+=poissonLL(at,games*m.AT_PROB[s]));reasons.push(`AT ${at}回 / ${games}G`);}
    if(hikimodosi!=null&&hikimodosi_total>0){S.forEach(s=>logL[s]+=binomialLL(hikimodosi,hikimodosi_total,m.RETURN[s]));reasons.push(`死に戻り ${hikimodosi}/${hikimodosi_total}`);}
    if(!hikimodosi_total) suggestions.push("死に戻り発生率をカウント（最重要）");
  }

  const probs=normalizeLLs(S,logL);
  const events=data.events||[];
  let filteredSettings=new Set(S);
  for(const ev of events){if(m.EVENTS[ev]){const allowed=new Set(m.EVENTS[ev]);filteredSettings=new Set([...filteredSettings].filter(s=>allowed.has(s)));reasons.push(`${ev} → 設定${m.EVENTS[ev].join("/")}確定`);}}
  if(filteredSettings.size>0&&filteredSettings.size<S.length){let total=0;S.forEach(s=>{if(!filteredSettings.has(s))probs[s]=0;else total+=probs[s];});if(total>0)S.forEach(s=>probs[s]/=total);}
  return{probs,reasons,suggestions};
}

// ========== UI ==========
let currentMachine = "";

function onMachineChange() {
  currentMachine = document.getElementById("machine-select").value;
  document.getElementById("result").style.display = "none";
  if (!currentMachine) { document.getElementById("form-area").innerHTML = ""; return; }
  renderForm(currentMachine);
  if (currentUser) syncFromFirestore(currentMachine);
}

function renderForm(machine) {
  const m = MACHINES[machine];
  const counts = loadCounts(machine);
  let html = `<div class="section-label">Data Input</div>`;

  for (const f of m.fields) {
    const val = counts[f.key] !== undefined ? counts[f.key] : 0;
    const helpId = `help_${machine}_${f.key}`;
    const helpBtn = f.help ? `<button class="help-btn" ontouchstart="" onclick="toggleHelp('${helpId}')">?</button>` : "";
    const helpText = f.help ? `<div class="help-text" id="${helpId}" style="display:none">${f.help}</div>` : "";
    if (f.type === "games") {
      html += `<div class="counter-group">
        <div class="counter-label">${f.label}${helpBtn}</div>
        ${helpText}
        <div class="counter-row">
          <button class="counter-btn minus games" ontouchstart="" onclick="adjustCount('${machine}','${f.key}',-10)">－10</button>
          <input class="games-input" id="field-${f.key}" type="number" min="0" value="${val}" inputmode="numeric" onchange="onGamesInput('${machine}','${f.key}',this.value)">
          <button class="counter-btn plus games" ontouchstart="" onclick="adjustCount('${machine}','${f.key}',10)">＋10</button>
        </div>
        ${f.note ? `<div class="counter-note">${f.note}</div>` : ""}
      </div>`;
    } else {
      html += `<div class="counter-group">
        <div class="counter-label">${f.label}${helpBtn}</div>
        ${helpText}
        <div class="counter-row">
          <button class="counter-btn minus" ontouchstart="" onclick="adjustCount('${machine}','${f.key}',-1)">－</button>
          <div class="counter-val" id="field-${f.key}">${val}</div>
          <button class="counter-btn plus" ontouchstart="" onclick="adjustCount('${machine}','${f.key}',1)">＋</button>
        </div>
        ${f.note ? `<div class="counter-note">${f.note}</div>` : ""}
      </div>`;
    }
  }

  if (m.EVENTS && Object.keys(m.EVENTS).length > 0) {
    const savedEvents = counts._events || [];
    html += `<div class="events-section">
      <label class="main">Confirmed Events</label>`;
    for (const ev of Object.keys(m.EVENTS)) {
      const checked = savedEvents.includes(ev) ? "checked" : "";
      html += `<div class="event-item">
        <input type="checkbox" id="ev-${ev}" value="${ev}" ${checked} onchange="saveEvents('${machine}')">
        <span>${ev} <span style="color:var(--gray2)">→ 設定${m.EVENTS[ev].join("/")}</span></span>
      </div>`;
    }
    html += `</div>`;
  }

  html += `<div class="btn-row">
    <button id="calc-btn" onclick="calculate('${machine}')">JUDGE</button>
    <button id="reset-count-btn" onclick="resetCounts('${machine}')">RESET</button>
  </div>`;
  html += `<div class="save-badge" id="save-badge"></div>`;

  if (currentUser) {
    html += `<div class="sub-btn-row">
      <button class="sub-btn red" onclick="showHistory()">HISTORY</button>
      <button class="sub-btn" onclick="showStats()">STATS</button>
    </div>`;
  }

  document.getElementById("form-area").innerHTML = html;
}

function adjustCount(machine, key, delta) {
  const counts = loadCounts(machine);
  counts[key] = Math.max(0, (counts[key] || 0) + delta);
  saveCounts(machine, counts);
  const el = document.getElementById(`field-${key}`);
  if (el) { if (el.tagName === "INPUT") el.value = counts[key]; else el.textContent = counts[key]; }
  showSaveBadge();
}
function onGamesInput(machine, key, val) {
  const counts = loadCounts(machine);
  counts[key] = Math.max(0, parseInt(val) || 0);
  saveCounts(machine, counts);
  showSaveBadge();
}
function saveEvents(machine) {
  const counts = loadCounts(machine);
  const m = MACHINES[machine];
  counts._events = Object.keys(m.EVENTS).filter(ev => { const cb = document.getElementById(`ev-${ev}`); return cb && cb.checked; });
  saveCounts(machine, counts);
  showSaveBadge();
}
function showSaveBadge() {
  const badge = document.getElementById("save-badge");
  if (!badge) return;
  badge.textContent = "■ SAVED";
  clearTimeout(badge._t);
  badge._t = setTimeout(() => badge.textContent = "", 1200);
}
function resetCounts(machine) {
  if (!confirm("カウントをリセットしますか？")) return;
  localStorage.removeItem(storageKey(machine));
  if (currentUser) db.collection('users').doc(currentUser.uid).collection('machine_counts').doc(machine).delete().catch(()=>{});
  renderForm(machine);
  document.getElementById("result").style.display = "none";
}

function calculate(machine) {
  const m = MACHINES[machine];
  const counts = loadCounts(machine);
  const data = {};
  for (const f of m.fields) { const v = counts[f.key]; if (v !== undefined) data[f.key] = v; }
  data.events = counts._events || [];
  const { probs, reasons, suggestions } = calcBayesian(machine, data);
  const S = m.settings;
  const highProb = S.filter(s => s >= 4).reduce((a, s) => a + (probs[s] || 0), 0);
  renderResult(m, probs, reasons, suggestions, data.games || 0, highProb);
}

function renderResult(m, probs, reasons, suggestions, games, highProb) {
  const S = m.settings.slice().sort((a,b)=>a-b);
  const sorted = S.slice().sort((a,b) => probs[b]-probs[a]);
  const best = sorted[0];
  const confidence = games < 300 ? "LOW  ( < 300G )" : games < 600 ? "MID  ( 300-599G )" : "HIGH  ( 600G+ )";

  let html = `<div class="result-header">
    <div class="result-label">High Setting Probability</div>
    <div class="high-prob"><span>${(highProb*100).toFixed(0)}</span>%</div>
    <div class="confidence">CONFIDENCE : ${confidence}</div>
  </div>`;

  for (const s of sorted) {
    const p = probs[s] || 0;
    const barClass = p > 0.25 ? "high" : p > 0.12 ? "mid" : "";
    html += `<div class="setting-row">
      <div class="setting-label ${s===best?"top":""}">${s===best?"▶":""} 設定${s}</div>
      <div class="bar-wrap"><div class="bar ${barClass}" style="width:${Math.min(p*100,100)}%"></div></div>
      <div class="pct">${(p*100).toFixed(1)}%</div>
    </div>`;
  }

  if (reasons.length > 0) {
    html += `<div class="reasons"><h3>Evidence</h3>`;
    for (const r of reasons) html += `<div class="reason-item">${r}</div>`;
    html += `</div>`;
  }
  if (suggestions.length > 0) {
    html += `<div class="suggestions"><h3>Next Actions</h3>`;
    for (const sg of suggestions) html += `<div class="sug-item">▷ ${sg}</div>`;
    html += `</div>`;
  }

  if (currentUser) {
    html += `<div class="session-save">
      <h3>Save Session</h3>
      <input class="session-input" id="session-store" type="text" placeholder="店舗名（例: ピーアーク北綾瀬）">
      <input class="session-input" id="session-daiban" type="text" placeholder="台番（例: 42番）" inputmode="numeric">
      <input class="session-input" id="session-memo" type="text" placeholder="メモ（任意）">
      <button class="save-session-btn" onclick="saveSession('${currentMachine}', ${(highProb*100).toFixed(0)})">RECORD SESSION</button>
      <div class="saved-msg" id="saved-msg"></div>
    </div>`;
  }

  html += `<button class="close-result-btn" onclick="document.getElementById('result').style.display='none'">CLOSE</button>`;

  const el = document.getElementById("result");
  el.innerHTML = html;
  el.style.display = "block";
  el.scrollIntoView({behavior:"smooth"});
}

// ========== セッション記録 ==========
async function saveSession(machine, highProb) {
  if (!currentUser) return;
  const store  = document.getElementById('session-store').value.trim();
  const daiban = document.getElementById('session-daiban').value.trim();
  const memo   = document.getElementById('session-memo').value.trim();
  const counts = loadCounts(machine);
  try {
    await db.collection('users').doc(currentUser.uid).collection('sessions').add({
      machine, machineName: MACHINES[machine].name,
      store, daiban, memo,
      games: counts.games || 0,
      highSettingProb: highProb,
      counts: JSON.stringify(counts),
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      date: new Date().toLocaleDateString('ja-JP')
    });
    const msg = document.getElementById('saved-msg');
    if (msg) msg.textContent = '■ SESSION RECORDED';
  } catch(e) {
    const msg = document.getElementById('saved-msg');
    if (msg) msg.textContent = 'ERROR: ' + e.message;
  }
}

// ========== 履歴 ==========
let allSessions = [];
let activeStoreFilter = null;

async function showHistory() {
  document.getElementById('history-modal').style.display = 'block';
  if (!currentUser) { document.getElementById('history-list').innerHTML = '<div class="no-history">LOGIN REQUIRED</div>'; return; }
  document.getElementById('history-list').innerHTML = '<div class="no-history">LOADING...</div>';
  try {
    const snap = await db.collection('users').doc(currentUser.uid).collection('sessions').orderBy('createdAt','desc').limit(100).get();
    allSessions = [];
    snap.forEach(doc => allSessions.push(doc.data()));
    activeStoreFilter = null;
    renderHistoryFilters();
    renderHistoryList();
  } catch(e) {
    document.getElementById('history-list').innerHTML = `<div class="no-history">ERROR: ${e.message}</div>`;
  }
}

function renderHistoryFilters() {
  const stores = [...new Set(allSessions.map(s => s.store).filter(s => s))];
  let html = `<button class="filter-btn ${!activeStoreFilter ? 'active' : ''}" onclick="setStoreFilter(null)">ALL</button>`;
  for (const store of stores) {
    html += `<button class="filter-btn ${activeStoreFilter === store ? 'active' : ''}" onclick="setStoreFilter('${store}')">${store}</button>`;
  }
  document.getElementById('store-filters').innerHTML = html;
}

function setStoreFilter(store) {
  activeStoreFilter = store;
  renderHistoryFilters();
  renderHistoryList();
}

function renderHistoryList() {
  const filtered = activeStoreFilter ? allSessions.filter(s => s.store === activeStoreFilter) : allSessions;
  if (filtered.length === 0) { document.getElementById('history-list').innerHTML = '<div class="no-history">NO RECORDS</div>'; return; }
  let html = '';
  for (const d of filtered) {
    html += `<div class="session-card">
      <div class="sc-top"><span>${d.date || ''}</span><span>${d.daiban || ''}</span></div>
      <div class="sc-machine">${d.machineName || d.machine}</div>
      ${d.store ? `<div class="sc-store">▶ ${d.store}</div>` : ''}
      <div class="sc-prob">HIGH SETTING <span>${d.highSettingProb}%</span>（${d.games}G）</div>
      ${d.memo ? `<div class="sc-memo">${d.memo}</div>` : ''}
    </div>`;
  }
  document.getElementById('history-list').innerHTML = html;
}

// ========== 統計 ==========
async function showStats() {
  document.getElementById('stats-modal').style.display = 'block';
  if (!currentUser) { document.getElementById('stats-content').innerHTML = '<div class="no-history">LOGIN REQUIRED</div>'; return; }
  document.getElementById('stats-content').innerHTML = '<div class="no-history">LOADING...</div>';
  try {
    const snap = await db.collection('users').doc(currentUser.uid).collection('sessions').orderBy('createdAt','desc').get();
    const sessions = [];
    snap.forEach(doc => sessions.push(doc.data()));
    if (sessions.length === 0) { document.getElementById('stats-content').innerHTML = '<div class="no-history">NO DATA YET</div>'; return; }

    // 全体統計
    const totalSessions = sessions.length;
    const avgProb = sessions.reduce((a, s) => a + s.highSettingProb, 0) / totalSessions;
    const highCount = sessions.filter(s => s.highSettingProb >= 60).length;

    // 機種別
    const byMachine = {};
    for (const s of sessions) {
      const key = s.machineName || s.machine;
      if (!byMachine[key]) byMachine[key] = [];
      byMachine[key].push(s.highSettingProb);
    }

    // 店舗別
    const byStore = {};
    for (const s of sessions) {
      if (!s.store) continue;
      if (!byStore[s.store]) byStore[s.store] = [];
      byStore[s.store].push(s.highSettingProb);
    }

    let html = `<div class="stat-overview">
      <div class="stat-big"><div class="sb-val">${totalSessions}</div><div class="sb-label">Total Sessions</div></div>
      <div class="stat-big"><div class="sb-val">${avgProb.toFixed(0)}%</div><div class="sb-label">Avg High Setting</div></div>
      <div class="stat-big"><div class="sb-val">${highCount}</div><div class="sb-label">High Prob（60%+）</div></div>
      <div class="stat-big"><div class="sb-val">${(highCount/totalSessions*100).toFixed(0)}%</div><div class="sb-label">Hit Rate</div></div>
    </div>`;

    // 機種別
    html += `<div class="stat-section"><h3>By Machine</h3>`;
    const machineList = Object.entries(byMachine).sort((a,b) => (b[1].reduce((x,y)=>x+y,0)/b[1].length) - (a[1].reduce((x,y)=>x+y,0)/a[1].length));
    for (const [name, probs] of machineList) {
      const avg = probs.reduce((a,b)=>a+b,0)/probs.length;
      const best = Math.max(...probs);
      html += `<div class="stat-card">
        <div class="sc-name">${name}</div>
        <div class="sc-nums"><div class="sc-avg">${avg.toFixed(0)}%</div><div class="sc-count">${probs.length}回 / MAX ${best}%</div></div>
      </div>`;
    }
    html += `</div>`;

    // 店舗別
    if (Object.keys(byStore).length > 0) {
      html += `<div class="stat-section"><h3>By Store</h3>`;
      const storeList = Object.entries(byStore).sort((a,b) => (b[1].reduce((x,y)=>x+y,0)/b[1].length) - (a[1].reduce((x,y)=>x+y,0)/a[1].length));
      for (const [name, probs] of storeList) {
        const avg = probs.reduce((a,b)=>a+b,0)/probs.length;
        html += `<div class="stat-card">
          <div class="sc-name">${name}</div>
          <div class="sc-nums"><div class="sc-avg">${avg.toFixed(0)}%</div><div class="sc-count">${probs.length}回</div></div>
        </div>`;
      }
      html += `</div>`;
    }

    document.getElementById('stats-content').innerHTML = html;
  } catch(e) {
    document.getElementById('stats-content').innerHTML = `<div class="no-history">ERROR: ${e.message}</div>`;
  }
}

function closeModal(id) { document.getElementById(id).style.display = 'none'; }
function toggleHelp(id) { const el = document.getElementById(id); if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none'; }
</script>
